name: update-typhoon-data-primary

on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # 主任务：每 15 分钟一班并避开整点高峰；GitHub 偶发丢班时由守护任务补偿
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: typhoon-data-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch typhoon data with retries
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if node scripts/fetch-typhoon.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Data fetch failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Validate generated data
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('data/typhoon.json', 'utf8'));
          if (!data || typeof data.updatedAt !== 'string' || !Array.isArray(data.typhoons)) {
            throw new Error('Invalid data/typhoon.json structure');
          }
          for (const item of data.typhoons) {
            if (!item || !item.now || !Array.isArray(item.track)) {
              throw new Error('Invalid typhoon item');
            }
          }
          // 预警字段可降级（ok:false）但不可缺失：缺失说明脚本回退到了改版前的 schema
          if (!data.alerts || typeof data.alerts.ok !== 'boolean') {
            throw new Error('Missing alerts block');
          }
          if (!Array.isArray(data.recentlyEnded)) {
            throw new Error('Missing recentlyEnded block');
          }
          const alertNote = data.alerts.ok
            ? `${data.alerts.total} alert(s)`
            : `alerts DEGRADED (${data.alerts.error || 'unknown'})`;
          console.log(`validated ${data.typhoons.length} active typhoon(s), ${alertNote}, ${data.recentlyEnded.length} in aftermath @ ${data.updatedAt}`);
          // 台风季存档是附属产物：结构异常时回退到仓库里的上一版，不拖累实况提交
          try {
            const season = JSON.parse(fs.readFileSync('data/season.json', 'utf8'));
            if (!Number.isInteger(season.year) || !Array.isArray(season.storms)) throw new Error('bad structure');
            for (const e of season.storms) {
              if (!e || typeof e.code !== 'string' || !Array.isArray(e.track)) throw new Error('bad storm entry');
            }
            console.log(`season ${season.year}: ${season.storms.length} storm(s) archived`);
          } catch (error) {
            console.warn(`season.json invalid, reverting: ${error.message}`);
            require('node:child_process').execSync('git checkout -- data/season.json', { stdio: 'inherit' });
          }
          NODE

      - name: Commit refreshed data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/  # typhoon.json + 台风季存档（跨年时另有 season-YYYY.json）
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "data: 15分钟主任务更新 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Purge jsDelivr mirror cache
        shell: bash
        run: |
          for f in typhoon.json season.json; do
            curl -fsS --max-time 20 "https://purge.jsdelivr.net/gh/Mr-Salticidae/typhoon-eye@main/data/$f" \
              || echo "jsDelivr purge of $f failed (non-fatal)"
          done
